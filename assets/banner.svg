<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-label="Two Minds AI Lab — two minds, learning in public. A working document that keeps its own drafts.">
  <title>Two Minds AI Lab</title>

  <!-- A sheet with a margin, the same one the site is built on. -->
  <rect x="0" y="0" width="1040" height="400" fill="#e8eae4"/>
  <rect x="40" y="0" width="960" height="400" fill="#eef0eb"/>

  <!-- The margin rule -->
  <rect x="340" y="0" width="1" height="400" fill="#a4560c" opacity="0.38"/>

  <!-- An annotation, hung in the margin and closed off against the rule -->
  <rect x="324" y="136" width="2" height="66" fill="#a4560c"/>
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" text-anchor="end">
    <text x="312" y="150" font-size="11" letter-spacing="1.8" fill="#a4560c">PERSON</text>
    <text x="312" y="172" font-size="12" fill="#5b615a">This page has already</text>
    <text x="312" y="190" font-size="12" fill="#5b615a">been rewritten twice.</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace">
    <text x="380" y="66" font-size="13" letter-spacing="2.2" fill="#191c18">TWO MINDS AI LAB</text>
  </g>

  <g font-family="Charter, 'Iowan Old Style', 'Palatino Linotype', Georgia, Constantia, serif" fill="#191c18">
    <text x="380" y="164" font-size="54">Two minds,</text>
    <text x="380" y="220" font-size="54">learning in public.</text>
    <text x="380" y="262" font-size="17" fill="#5b615a">One person and one model, working things out together.</text>
  </g>

  <!-- A draft, struck out but kept. Monospace so the strike lands on
       the text whichever mono face the viewer happens to have. -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15">
    <text x="380" y="322" fill="#949a92">A model always agrees with itself.</text>
    <rect x="380" y="317" width="306" height="1.5" fill="#a4560c" opacity="0.75"/>
    <text x="380" y="352" fill="#5b615a"><tspan fill="#a4560c">&#8594;</tspan>  cut. it described work that did not exist.</text>
  </g>
</svg>
